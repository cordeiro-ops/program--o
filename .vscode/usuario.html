<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="usu.css">

     <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0d0d0d;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: 'Arial Black', sans-serif;
            color: #fff;
            position: relative;
        }

        /* Fundo com Sinais de Cancelado (X) */
        .background-pattern {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            align-content: space-around;
            opacity: 0.15;
            z-index: 1;
            user-select: none;
        }

        .cancel-sign {
            font-size: 80px;
            color: #ff0000;
            transform: rotate(-20deg);
        }

        /* Container Principal */
        .main-content {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 20px;
        }

        /* Policial em CSS/Emoji */
        .police-icon {
            font-size: 120px;
            margin-bottom: 10px;
            display: block;
        }

        /* Algemas em CSS/Emoji */
        .handcuffs-icon {
            font-size: 60px;
            display: inline-block;
            transform: rotate(15deg);
            margin-left: 20px;
        }

        /* Frase Grande */
        h1 {
            font-size: 5rem;
            line-height: 1;
            color: #ff3333;
            text-transform: uppercase;
            text-shadow: 5px 5px 0px #000, 0 0 20px rgba(255, 0, 0, 0.5);
            margin-top: 20px;
        }

        /* Animação simples de pulsação */
        .alert {
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.05); }
        }

        /* Responsividade para telas menores */
        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            .police-icon { font-size: 80px; }
        }
    </style>
</head>
<body>
    
    <!-- Padrão de Cancelado ao Fundo -->
    <div class="background-pattern">
        <div class="cancel-sign">✖</div> <div class="cancel-sign">✖</div>
        <div class="cancel-sign">✖</div> <div class="cancel-sign">✖</div>
        <div class="cancel-sign">✖</div> <div class="cancel-sign">✖</div>
        <div class="cancel-sign">✖</div> <div class="cancel-sign">✖</div>
        <div class="cancel-sign">✖</div> <div class="cancel-sign">✖</div>
        <div class="cancel-sign">✖</div> <div class="cancel-sign">✖</div>
    </div>

    <div class="main-content">
        <div class="alert">
            <span class="police-icon">👮‍♂️</span>
            <span class="handcuffs-icon">⛓️</span>
        </div>
        
        <h1>VOCÊ ESTÁ NO LUGAR ERRADO MEU AMIGO!</h1>
    </div>

</body>
</html>
